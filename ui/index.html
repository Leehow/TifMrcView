<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TifMrcView</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="toolbar">
    <button id="btn-open" title="打开文件 (Ctrl/⌘+O)">打开</button>
    <div class="group">
      <button id="btn-prev" title="上一个文件 (↑)" disabled>▲</button>
      <span id="file-pos">–</span>
      <button id="btn-next" title="下一个文件 (↓)" disabled>▼</button>
    </div>
    <span id="file-name" title=""></span>
    <div id="channels"></div>
    <div class="spacer"></div>
    <div class="group">
      <button id="btn-fit" title="适应窗口 (F)">适应</button>
      <button id="btn-1to1" title="原始大小 (1)">1:1</button>
      <button id="btn-sidebar" class="toggle on" title="显示/收起右侧预览栏 (B)">预览栏</button>
      <button id="btn-default" title="把 TifMrcView 设为 .tif/.tiff/.mrc 的默认打开方式">设为默认</button>
    </div>
  </header>

  <nav id="quickbar">
    <div class="seg" id="toolbtns">
      <button data-tool="pan" class="on" title="移动 (V)"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg><span>移动</span></button>
      <button data-tool="select" title="选择：点选标注后拖动、缩放，拖端点重新测量，Delete 删除 (S)"><svg viewBox="0 0 24 24"><path d="M5 3l6 17 2.5-7.5L21 10z"/></svg><span>选择</span></button>
      <button data-tool="measure" title="测距 (M)"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>测距</span></button>
      <button data-tool="pen" title="画笔 (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg><span>画笔</span></button>
      <button data-tool="rect" title="画框 (R)，按住 Shift 画正方形"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>画框</span></button>
      <button data-tool="ellipse" title="画圆 (E)，按住 Shift 画正圆"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="7"/></svg><span>画圆</span></button>
      <button data-tool="crop" title="裁剪 (C)：框出区域后双击或回车裁剪，Esc / 退格撤回"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span>裁剪</span></button>
    </div>
    <label class="qitem" title="标注颜色"><input type="color" id="ann-color" value="#ffb020" /></label>
    <label class="qitem" title="线宽"><select id="ann-width"><option>1</option><option selected>2</option><option>3</option><option>5</option><option>8</option></select></label>
    <span class="sep"></span>
    <button id="btn-scalebar" class="toggle" title="显示/隐藏比例尺（像素尺寸在「更多」里改）"><svg viewBox="0 0 24 24"><path d="M3 16h18M3 12v8M21 12v8M12 14v4"/></svg><span>比例尺</span></button>
    <button id="btn-contrast" class="toggle" title="亮度 / 对比度"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><span>亮度对比度</span></button>
    <button id="btn-save" title="存图：按原始分辨率存 PNG，裁剪后只存裁剪区域，带上显示中的标注和比例尺。Ctrl/⌘+S 直接存到图片所在文件夹"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>存图</span></button>
    <span class="sep"></span>
    <button id="btn-undo" title="撤销 (Ctrl/⌘+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="btn-annshow" class="toggle on" title="显示/隐藏标注 (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div class="spacer"></div>
    <button id="btn-tools" class="toggle" title="更多：亮度对比度、标注、IMOD 模型、比例尺设置 (T)"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>更多</span></button>
  </nav>

  <div id="body">
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="empty">
        <div class="big">拖入或双击打开图像</div>
        <div class="hint">支持 tif / tiff / mrc / mrcs / png / jpg / bmp / gif / webp</div>
        <div class="hint">↑ ↓ 切换文件　← → 切换 Z　空格 播放　滚轮 缩放　拖动 平移　Ctrl/⌘+S 存 PNG</div>
      </div>
      <div id="loading" hidden></div>
      <div id="size-out"></div>

      <aside id="tools" hidden>
        <section id="sec-contrast">
          <h3>亮度 / 对比度 <span id="tool-chan" class="dim"></span></h3>
          <canvas id="hist" width="256" height="64" title="在直方图上拖动可直接选择显示范围"></canvas>
          <div class="row">
            <label><input type="checkbox" id="auto" checked /> 自动（每层）</label>
            <button id="btn-reset" class="small">重置</button>
          </div>
          <div class="row">
            <input type="number" id="cmin" step="any" title="显示最小值" />
            <span>–</span>
            <input type="number" id="cmax" step="any" title="显示最大值" />
          </div>
          <label class="slider">亮度 <input type="range" id="bright" min="0" max="100" step="0.5" value="50" /></label>
          <label class="slider">对比度 <input type="range" id="contr" min="0" max="100" step="0.5" value="50" /></label>
          <label class="slider">γ <input type="range" id="gamma" min="0.2" max="3" step="0.05" value="1" /><span id="gamma-v">1.00</span></label>
        </section>

        <section id="sec-ann">
          <h3>标注</h3>
          <div class="row">
            <label><input type="checkbox" id="ann-show" checked /> 显示标注 (H)</label>
            <button id="btn-clear" class="small">清除本层</button>
          </div>
          <div id="measure-out" class="dim"></div>
          <div id="ann-file" class="dim"></div>
        </section>

        <section>
          <h3>IMOD 模型</h3>
          <div class="row">
            <label><input type="checkbox" id="mod-show" checked /> 显示模型 (I)</label>
            <button id="btn-mod-load" class="small">加载模型…</button>
          </div>
          <div id="mod-info" class="dim">同名的 .mod / .fid 会自动加载</div>
          <div id="mod-objects"></div>
        </section>

        <section id="sec-scale">
          <h3>比例尺</h3>
          <div class="row">
            <label><input type="checkbox" id="sb-show" /> 显示比例尺</label>
          </div>
          <div class="row">
            <span class="dim">像素尺寸</span>
            <input type="number" id="px-size" step="any" min="0" placeholder="未知" />
            <select id="px-unit"><option>Å</option><option>nm</option><option selected>µm</option><option>mm</option></select>
          </div>
          <div id="px-src" class="dim"></div>
        </section>

      </aside>
    </main>

    <aside id="sidebar">
      <div id="strip"></div>
    </aside>
  </div>

  <section id="zbar" hidden>
    <button id="btn-play" title="播放 Z (空格)">▶</button>
    <span class="dim">Z</span>
    <input type="range" id="zslider" min="0" max="0" value="0" />
    <span id="zlabel"></span>
    <div id="tgroup" hidden>
      <span class="dim">T</span>
      <input type="range" id="tslider" min="0" max="0" value="0" />
      <span id="tlabel"></span>
    </div>
  </section>

  <footer id="status">
    <span id="st-info"></span>
    <span id="st-zoom"></span>
    <span id="st-pixel"></span>
  </footer>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
