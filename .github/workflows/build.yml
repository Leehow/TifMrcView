name: Packaged local folder QA

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
      platform:
        type: choice
        options: [linux, windows]
        default: windows

permissions:
  actions: read
  contents: read

jobs:
  linux-folder:
    if: ${{ !inputs.publish && inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      SOURCE_RUN: '45137410969'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: |
          scripts/ci-apt.sh libwebkit2gtk-4.1-0 libgtk-3-0 libxdo3 libayatana-appindicator3-1 \
            webkit2gtk-driver xvfb xauth xdotool openbox imagemagick dbus-x11 fonts-noto-cjk
          cargo install tauri-driver --locked
      - name: Wait for the Linux Pro package from the publication build
        run: |
          for _ in {1..140}; do
            artifact=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name=="TifMrcView-pro-linux-x64") | .id')
            if [[ -n "$artifact" ]]; then exit 0; fi
            state=$(gh run view "$SOURCE_RUN" --json status --jq .status)
            if [[ "$state" == 'completed' ]]; then echo 'Linux Pro package is missing'; exit 1; fi
            sleep 30
          done
          echo 'Timed out waiting for Linux Pro package'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: TifMrcView-pro-linux-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Run the packaged application in a virtual X11 desktop
        run: |
          pkg=$(find artifacts -type f -name '*.deb' -print -quit)
          test "$(dpkg-deb -f "$pkg" Version)" = '0.7.331'
          dpkg-deb -x "$pkg" "$RUNNER_TEMP/tmv"
          exe="$RUNNER_TEMP/tmv/usr/bin/tifmrcview-pro"
          test -x "$exe"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24' python3 scripts/linux-folder-smoke.py "$exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-folder-evidence
          path: linux-qa-*.png
          if-no-files-found: ignore

  windows-folder:
    if: ${{ !inputs.publish && inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      SOURCE_RUN: '45137410969'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's native WebDriver adapter
        shell: pwsh
        run: cargo install tauri-driver --locked
      - name: Wait for the Windows Pro package from the publication build
        shell: bash
        run: |
          for _ in {1..140}; do
            artifact=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name=="TifMrcView-pro-windows-x64") | .id')
            if [[ -n "$artifact" ]]; then exit 0; fi
            state=$(gh run view "$SOURCE_RUN" --json status --jq .status)
            if [[ "$state" == 'completed' ]]; then echo 'Windows Pro package is missing'; exit 1; fi
            sleep 30
          done
          echo 'Timed out waiting for Windows Pro package'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: TifMrcView-pro-windows-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Install Pro and verify its real Windows folder chooser
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifacts -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Packaged installer missing' }
          $installed = Join-Path $env:RUNNER_TEMP 'tmv-qa-app'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installed" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $exe = Get-ChildItem -LiteralPath $installed -Recurse -Filter 'tifmrcview-pro.exe' | Select-Object -First 1
          if (!$exe) { throw 'Installed Pro executable missing' }
          $runtimeRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $runtime = Get-ChildItem -Path "$runtimeRoot\*\msedgewebview2.exe" | Sort-Object { [version]$_.VersionInfo.ProductVersion } | Select-Object -Last 1
          if (!$runtime) { throw 'Installed WebView2 runtime missing' }
          $version = $runtime.VersionInfo.ProductVersion
          Write-Output "WebView2 $version"
          $zip = Join-Path $env:RUNNER_TEMP 'tmv-edge-driver.zip'
          $driverDir = Join-Path $env:RUNNER_TEMP 'tmv-edge-driver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip -TimeoutSec 45
          Expand-Archive -LiteralPath $zip -DestinationPath $driverDir
          python scripts/windows-folder-smoke.py $exe.FullName (Join-Path $driverDir 'msedgedriver.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows folder test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-folder-evidence
          path: windows-qa-*.png
          if-no-files-found: ignore
