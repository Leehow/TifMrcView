name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "发布到下载站（自动版本号）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || 'https://tifmrcview.com/tifmrcview' }}
  DIRECT_BASE_URL: ${{ vars.DIRECT_BASE_URL || 'https://dl.tifmrcview.com:9443/tifmrcview' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Tags give the version; otherwise major.minor from tauri.conf.json and
      # the commit count as the patch number, so every build is newer.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
            v="$base.$(git rev-list --count HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "notes=$(git log -1 --pretty=%s | tr -d '\r' | head -c 300)" >> "$GITHUB_OUTPUT"
          echo "Version $v"

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev

      # wasm32: the end-to-end tests build the WebAssembly plugins.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Windows thumbnail DLL and COM tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: |
          cargo build --target x86_64-pc-windows-msvc -p tmv-thumbnail-win
          cargo test --target x86_64-pc-windows-msvc -p tmv-thumbnail-win

      - name: Pro edition
        working-directory: src-tauri
        run: |
          cargo test --features pro --lib
          cargo check --features pro
          cargo test -p tmv-sam

      - name: Headless thumbnail core
        working-directory: src-tauri
        run: |
          cargo test --no-default-features --lib
          cargo test -p tmv-thumbnail-ffi

      - name: Linux CLI without a display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import struct
          header = bytearray(1024)
          struct.pack_into('<4i', header, 0, 16, 16, 1, 6)
          header[208:212] = b'MAP '
          header[212] = 0x44
          with open('/tmp/thumbnail.mrc', 'wb') as f:
              f.write(header)
              f.write(struct.pack('<256H', *range(108, 364)))
          PYTHON
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run --manifest-path src-tauri/Cargo.toml --bin tifmrcview -- --thumbnail /tmp/thumbnail.mrc /tmp/thumbnail.png --size 64
          test "$(od -An -tx1 -N8 /tmp/thumbnail.png | tr -d ' \n')" = 89504e470d0a1a0a

      - name: plugin crates
        if: runner.os == 'Linux'
        run: |
          for p in plugins/*/ templates/format-plugin/; do
            [ -f "$p/Cargo.toml" ] || continue
            cargo test --manifest-path "$p/Cargo.toml" --target-dir target/plugin-tests
          done

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22

      - name: Plugin manifests and checker
        if: runner.os == 'Linux'
        run: |
          node --test scripts/tmv-plugin.test.mjs
          for p in plugins/*/ templates/format-plugin/; do
            [ -f "$p/plugin.json" ] || continue
            node scripts/tmv-plugin.mjs check "$p"
          done
          node templates/format-plugin/build.mjs
          node scripts/tmv-plugin.mjs check templates/format-plugin/dist/*.zip

  bundle:
    needs: version
    # Installers take most of the CI time (Pro, macOS universal), so pull
    # requests only run the tests; main, tags and manual runs still bundle.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # standard = TifMrcView, pro = TifMrcView Pro (tauri.pro.conf.json).
        edition: [standard, pro]
        name: [macos-universal, windows-x64, linux-x64]
        include:
          - name: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
          - name: windows-x64
            platform: windows-latest
            args: ""
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm nasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.edition }}

      - run: npm ci || npm install

      # Version, update feed and (when the signing key is available) signed
      # updater packages are passed as a config overlay; Pro starts from
      # tauri.pro.conf.json and reads latest-pro*.json from the same folder.
      - name: Build config
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          EDITION: ${{ matrix.edition }}
        run: |
          node -e '
            const pro = process.env.EDITION === "pro";
            const feed = pro ? "latest-pro" : "latest";
            const c = pro ? JSON.parse(require("fs").readFileSync("src-tauri/tauri.pro.conf.json", "utf8")) : {};
            c.version = process.env.VERSION;
            c.plugins = { updater: { endpoints: [
                process.env.DIRECT_BASE_URL.replace(/\/+$/, "") + `/${feed}-direct.json`,
                process.env.UPDATE_BASE_URL.replace(/\/+$/, "") + `/${feed}.json`
              ] } };
            if (process.env.HAS_KEY === "true") c.bundle = { ...c.bundle, createUpdaterArtifacts: true };
            require("fs").writeFileSync("src-tauri/tauri.ci.conf.json", JSON.stringify(c, null, 2));
          '
          cat src-tauri/tauri.ci.conf.json

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: TifMrcView-${{ matrix.edition }}-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/nsis/*-setup.exe*
            src-tauri/target/**/release/bundle/deb/*.deb*
            src-tauri/target/**/release/bundle/rpm/*.rpm*
            src-tauri/target/**/release/bundle/appimage/*.AppImage*
          if-no-files-found: error

  publish:
    needs: [version, bundle]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # pack-plugins.mjs builds the WebAssembly plugins.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/zeiss -> ../../target/wasm-plugins

      - uses: actions/download-artifact@v4
        with:
          pattern: TifMrcView-standard-*
          path: artifacts/standard

      - uses: actions/download-artifact@v4
        with:
          pattern: TifMrcView-pro-*
          path: artifacts/pro

      - name: Assemble release
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          node scripts/make-release.mjs artifacts/standard release "$VERSION" "$UPDATE_BASE_URL" "$NOTES" "$DIRECT_BASE_URL"
          TMV_EDITION=pro node scripts/make-release.mjs artifacts/pro release "$VERSION" "$UPDATE_BASE_URL" "$NOTES" "$DIRECT_BASE_URL"
          ls -lR release
          node scripts/pack-plugins.mjs release

      - name: Upload to download site
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/tifmrcview' }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER not set; skipping upload"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_cmd="ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          dest="$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}"
          # Version folder first, feeds last, so clients never see a half-uploaded release.
          rsync -av --chmod=D755,F644 -e "$ssh_cmd" "release/$VERSION" "$dest/"
          # Plugin market packages and index (served at /plugins/).
          rsync -av --chmod=D755,F644 -e "$ssh_cmd" release/plugins/ "$dest/plugins/"
          for f in latest.json latest-direct.json downloads.json latest-pro.json latest-pro-direct.json downloads-pro.json; do
            [ -f "release/$f" ] && rsync -av --chmod=D755,F644 -e "$ssh_cmd" "release/$f" "$dest/$f"
          done

      # Deploys rewrite files in place (plugin zips are rebuilt every time), and
      # Cloudflare keeps versioned files for 30 days, so drop its copies.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID || '3dc3af1d7361be94d38608f6e7c642d9' }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CF_PURGE_TOKEN not set; Cloudflare may serve old copies of rebuilt files"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TifMrcView ${{ github.ref_name }}
          body: "下载对应系统的安装包：macOS 用 .dmg，Windows 用 -setup.exe，Linux 用 .deb / .rpm / .AppImage。"
          files: release/${{ env.VERSION }}/*
