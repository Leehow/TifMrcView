name: plugins

# Publishes the plugin market packages (plugins/*.zip, plugins.json) without
# a full release. The website pages live in a separate repository with their
# own deploy. Never uses --delete: the server also holds the site, release
# folders, latest.json and downloads.json.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/pack-plugins.mjs"
      - "scripts/plugin-zip.mjs"
      - "scripts/plugin-manifest.mjs"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pack-plugins.mjs builds the WebAssembly plugins.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/zeiss -> ../../target/wasm-plugins

      - name: Pack plugins
        run: |
          mkdir -p stage
          node scripts/pack-plugins.mjs stage
          find stage -type f | sort

      - name: Upload to download site
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/tifmrcview' }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER not set; skipping upload"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_cmd="ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          dest="$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}"
          # No --delete on purpose.
          rsync -av --chmod=D755,F644 -e "$ssh_cmd" stage/plugins/ "$dest/plugins/"

      # Plugin packages also go to the mirror in mainland China, which the
      # main server sends visitors from China to. Optional; a failure only warns.
      - name: Upload plugins to the China mirror
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_PORT: ${{ vars.MIRROR_PORT || '22' }}
          MIRROR_PATH: ${{ vars.MIRROR_PATH || '/var/www/tifmrcview' }}
        run: |
          if [ -z "$MIRROR_SSH_KEY" ] || [ -z "$MIRROR_HOST" ] || [ -z "$MIRROR_USER" ]; then
            echo "::notice::MIRROR_SSH_KEY / MIRROR_HOST / MIRROR_USER not set; skipping the China mirror"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          ssh-keyscan -p "$MIRROR_PORT" -H "$MIRROR_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          mirror_ssh="ssh -i $HOME/.ssh/mirror -p $MIRROR_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"
          timeout 5m rsync -av --checksum --chmod=D755,F644 -e "$mirror_ssh" stage/plugins/ "$MIRROR_USER@$MIRROR_HOST:${MIRROR_PATH%/}/plugins/" \
            || echo "::warning::China mirror upload failed; plugin downloads from China fall back to the main site"

      # Plugin zips are rewritten in place and Cloudflare keeps versioned
      # files for 30 days, so drop its copies.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID || '3dc3af1d7361be94d38608f6e7c642d9' }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "::warning::CF_PURGE_TOKEN not set; Cloudflare may serve old copies of rebuilt files"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
