[package]
name = "tifmrcview"
version = "0.7.0"
description = "Fast TIFF / MRC stack viewer"
authors = ["Leehow"]
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["thumbnail-ffi", "thumbnail-win", "sam"]
resolver = "2"

[[bin]]
name = "tifmrcview"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "tifmrcview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
tauri = { optional = true, version = "2.12", features = [] }
tauri-plugin-single-instance = { optional = true, version = "2.5", features = ["deep-link"] }
# tifmrcview:// links (one-click plugin install from the market page).
tauri-plugin-deep-link = { version = "2.6", optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
tiff = "0.11"
weezl = "0.1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
memmap2 = "0.9"
rayon = "1.10"
anyhow = "1"
ruzstd = "0.8"
# Sandboxed WebAssembly format plugins (pure-Rust interpreter). Loop dispatch:
# tail-call dispatch overflows the stack when LLVM does not optimise it (debug).
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
openh264 = { version = "0.9", optional = true }
tauri-plugin-updater = { version = "2.14", optional = true }
# Market downloads reuse the updater's HTTP stack (reqwest + rustls/ring).
reqwest = { optional = true, version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { optional = true, version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# Pro: SAM 2.1 click segmentation on the GPU (wgpu), CPU when there is none.
tmv-sam = { path = "sam", optional = true, default-features = false, features = ["wgpu", "flex"] }
# Imaris LZ4 chunks (HDF5 filter 32004).
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }

[features]
default = ["desktop", "recorder"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls"]
# TifMrcView Pro: build with --config tauri.pro.conf.json (see src/edition.rs).
pro = ["dep:tmv-sam"]
# MP4 recorder plugin (OpenH264, adds about 1 MB).
recorder = ["desktop", "dep:openh264"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
# SAM kernels compiled to Metal Shading Language: about 4x faster image
# encoding than WGSL on an M1 Max (and faster than with kernel fusion).
tmv-sam = { path = "sam", optional = true, default-features = false, features = ["metal", "flex"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: tauri-plugin-deep-link 2.6.2 does not compile against
# rust-ini 0.21.2+ (ParseOption gained fields), so hold it back.
rust-ini = "=0.21.1"
# Pro: CUDA for NVIDIA machines without a GPU Vulkan driver (WSL, compute
# servers). It needs libdevice.10.bc, which the Linux packages bring along
# (scripts/build-thumbnails.mjs); Vulkan and the CPU remain the fallbacks.
tmv-sam = { path = "sam", optional = true, default-features = false, features = ["cuda"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "sam_slice"
required-features = ["pro"]

[dev-dependencies]
tempfile = "3"
# Tests write LZ4 blocks.
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "alloc"] }
