[package]
name = "tifmrcview"
version = "0.5.0"
description = "Fast TIFF / MRC stack viewer"
authors = ["Leehow"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tifmrcview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
# tifmrcview:// links (one-click plugin install from the market page).
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
weezl = "0.1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
memmap2 = "0.9"
rayon = "1.10"
anyhow = "1"
ruzstd = "0.8"
# Sandboxed WebAssembly format plugins (pure-Rust interpreter). Loop dispatch:
# tail-call dispatch overflows the stack when LLVM does not optimise it (debug).
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "portable-dispatch"] }
openh264 = { version = "0.9", optional = true }
tauri-plugin-updater = "2.14"
# Market downloads reuse the updater's HTTP stack (reqwest + rustls/ring).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# Imaris LZ4 chunks (HDF5 filter 32004).
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }

[features]
default = ["recorder"]
# MP4 recorder plugin (OpenH264, adds about 1 MB).
recorder = ["dep:openh264"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: tauri-plugin-deep-link 2.6.2 does not compile against
# rust-ini 0.21.2+ (ParseOption gained fields), so hold it back.
rust-ini = "=0.21.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tempfile = "3"
# Tests write LZ4 blocks.
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "alloc"] }
