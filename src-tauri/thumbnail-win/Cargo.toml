[package]
name = "tmv-thumbnail-win"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[features]
pro = ["tifmrcview/pro"]

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
tifmrcview = { path = "..", default-features = false }
tempfile = "3"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
